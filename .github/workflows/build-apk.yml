name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            unzip

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip setuptools
          pip install buildozer cython

      - name: Pré-criar pasta e aceitar Licenças do Android SDK
        run: |
          # Cria as pastas de licença do Android SDK antes da compilação
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          
          # Injeta os hashes de licença aceitos oficialmente pelo Google Android SDK
          echo -e "2433370246379200086071292701363007201609\n84831b9409646a918e30573bab4c9c91346d8abd\nc59f171788ac820192a430720b1905d04d2a1063" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo -e "d9715e3842108635799ec111d59188382879e1b7" > ~/.buildozer/android/platform/android-sdk/licenses/android-googletv-license
          echo -e "6010087178a4e8689f6499b3d956882786b437e1" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license

      - name: Compilar o APK com Buildozer
        run: |
          # Aceita qualquer prompt extra que o Buildozer possa solicitar durante o build
          yes | buildozer android debug

      - name: Salvar o APK gerado como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
