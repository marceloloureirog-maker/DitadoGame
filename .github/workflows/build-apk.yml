name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Java 17
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk

      - name: Aceitar licenças Android
        run: |
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Android SDK Build Tools
        run: |
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar Android SDK
        run: |
          ls -la ${ANDROID_HOME}/build-tools
          ls -la ${ANDROID_HOME}/build-tools/35.0.0
          ${ANDROID_HOME}/build-tools/35.0.0/aidl --version

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer>=1.5.0"
          pip install "cython==0.29.37"

      - name: Limpar compilação anterior
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Gerar APK
        run: |
          buildozer -v android debug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: DitadoGame-APK
          path: bin/*.apk
