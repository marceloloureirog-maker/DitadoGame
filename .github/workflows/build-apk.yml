name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            unzip \
            wget

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip setuptools
          pip install buildozer cython

      - name: Baixar e estruturar Android Command-line Tools
        run: |
          # Prepara os diretórios exatos exigidos pelo Android SDK
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          
          # Baixa o pacote oficial de ferramentas de linha de comando
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          
          # Move todo o conteúdo extraído para a pasta 'latest'
          cp -r cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          rm -rf cmdline-tools cmdline-tools.zip

      - name: Aceitar Licenças do Android SDK
        run: |
          # Cria pasta de licenças
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          
          # Injeta os hashes de licença diretamente
          echo -e "2433370246379200086071292701363007201609\n84831b9409646a918e30573bab4c9c91346d8abd\nc59f171788ac820192a430720b1905d04d2a1063" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          
          # Aceita licenças dinamicamente usando o sdkmanager configurado
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compilar o APK com Buildozer
        run: |
          buildozer android debug

      - name: Salvar o APK gerado como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
